<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f5">
    <title>Threadline — Apparel Inventory</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#" data-page="dashboard" aria-label="Threadline dashboard">
          <span class="brand-mark" aria-hidden="true">T</span>
          <span><strong>threadline</strong><small>APPAREL INVENTORY</small></span>
        </a>
        <p class="nav-label">WORKSPACE</p>
        <nav class="primary-nav" aria-label="Main navigation">
          <button class="nav-item active" type="button" data-page="dashboard"><span class="nav-icon" aria-hidden="true">▦</span>Dashboard</button>
          <button class="nav-item" type="button" data-page="products"><span class="nav-icon" aria-hidden="true">◫</span>Products</button>
          <button class="nav-item" type="button" data-page="inventory"><span class="nav-icon" aria-hidden="true">⇄</span>Inventory</button>
          <button class="nav-item" type="button" data-page="categories"><span class="nav-icon" aria-hidden="true">▤</span>Categories</button>
          <button class="nav-item" type="button" data-page="low-stock"><span class="nav-icon" aria-hidden="true">⌁</span>Low stock<span class="nav-count" id="low-stock-count">0</span></button>
          <button class="nav-item" type="button" data-page="history"><span class="nav-icon" aria-hidden="true">◷</span>History</button>
        </nav>
        <div class="sidebar-bottom">
          <button class="nav-item" type="button" data-page="settings"><span class="nav-icon" aria-hidden="true">⚙</span>Settings &amp; backup</button>
          <div class="local-note"><span class="status-dot"></span><span>Stored on this device<small>Your inventory stays in this browser</small></span></div>
        </div>
      </aside>

      <div class="sidebar-scrim" id="sidebar-scrim"></div>
      <main class="main-area">
        <header class="topbar">
          <button class="icon-button menu-toggle" id="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">☰</button>
          <div class="breadcrumbs"><span>Workspace</span><span aria-hidden="true">/</span><strong id="page-crumb">Dashboard</strong></div>
          <div class="topbar-right"><span class="today-label" id="today-label"></span><span class="avatar" aria-hidden="true">TL</span></div>
        </header>
        <div class="stale-banner" id="stale-banner" role="alert" hidden>
          Inventory changed in another tab. Your open draft is preserved; reload before saving.
          <button type="button" id="reload-data">Reload data</button>
        </div>
        <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
        <section class="page-content" id="page-content" tabindex="-1"></section>
      </main>
    </div>

    <dialog id="app-dialog" aria-labelledby="dialog-title">
      <div class="dialog-content" id="dialog-content"></div>
    </dialog>

    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/products.js"></script>
    <script src="js/inventory.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
